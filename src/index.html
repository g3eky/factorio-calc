<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Factorio calculator</title>
    <meta name="description" content="Production calculator for Factorio and Space Age, styled like the game. Runs entirely in your browser." />
    <meta name="theme-color" content="#f4f3f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#232221" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <!-- The fonts the first screen uses, so text doesn't shift when they arrive. -->
    <link rel="preload" href="./theme/fonts/saira-condensed-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./theme/fonts/saira-condensed-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./theme/fonts/ibm-plex-sans.woff2" as="font" type="font/woff2" crossorigin />
    <meta property="og:title" content="Factorio calculator" />
    <meta property="og:description" content="Production calculator for Factorio and Space Age, styled like the game." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://g3eky.github.io/factorio-calc/preview.png" />
  </head>
  <body>
    <script>
      // UI scale and theme, before anything paints (src/settings/interface.ts keeps them up to date).
      try {
        const saved = JSON.parse(localStorage.getItem('factorio-calc:v1:interface'))
        if (saved?.theme === 'light' || saved?.theme === 'dark') document.documentElement.dataset.theme = saved.theme
        const scale = saved?.uiScale
        if ([0.75, 0.85, 1, 1.25, 1.5, 1.75, 2].includes(scale)) {
          document.documentElement.style.zoom = scale
          document.documentElement.style.setProperty('--ui-scale', scale)
        }
      } catch {}
    </script>
    <div id="root">
      <!-- Shown until the app starts, in the same place as the app's header. Inline styles so it paints immediately. -->
      <div style="padding: 12px 20px; font: 700 23px/1.5 'Saira Condensed', sans-serif; letter-spacing: 0.03em; text-transform: uppercase">Factorio calculator</div>
    </div>
    <script type="module" src="./app/main.tsx"></script>
  </body>
</html>
