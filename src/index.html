<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Factorio calculator</title>
    <meta name="description" content="Production calculator for Factorio and Space Age, styled like the game. Runs entirely in your browser." />
    <meta name="theme-color" content="#1b1a1b" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <meta property="og:title" content="Factorio calculator" />
    <meta property="og:description" content="Production calculator for Factorio and Space Age, styled like the game." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://g3eky.github.io/factorio-calc/preview.png" />
  </head>
  <body>
    <script>
      // UI scale, before anything paints (src/settings/interface.ts keeps it up to date).
      try {
        const scale = JSON.parse(localStorage.getItem('factorio-calc:v1:interface'))?.uiScale
        if ([0.75, 0.85, 1, 1.25, 1.5, 1.75, 2].includes(scale)) {
          document.documentElement.style.zoom = scale
          document.documentElement.style.setProperty('--ui-scale', scale)
        }
      } catch {}
    </script>
    <div id="root">
      <!-- Shown until the app starts, in the same place as the app's header. Inline styles so it paints immediately. -->
      <div style="padding: 12px; font: 15px 'Titillium Web', sans-serif">
        <div style="padding: 4px 12px; background: #313031; color: #ffe6c0; font-size: 20px; font-weight: 700; line-height: 1.5">Factorio calculator</div>
      </div>
    </div>
    <script type="module" src="./app/main.tsx"></script>
  </body>
</html>
